apiVersion: v1
kind: Pod
metadata:
  name: creating-demo
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: [sh, -c, "sleep 86400"]
      volumeMounts:
        - name: settings
          mountPath: /settings
  volumes:
    - name: settings
      configMap:
        name: required-volume
