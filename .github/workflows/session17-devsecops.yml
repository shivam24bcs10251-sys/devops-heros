name: Session 17 DevSecOps
on:
  push:
    branches: [session17-devsecops]
    paths:
      - 'session-17-devsecops/demo/**'
      - '.github/workflows/session17-devsecops.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  deliver:
    name: Build, security gates, publish and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE: ghcr.io/shivam24bcs10251-sys/devops-heros-session17:${{ github.sha }}
    defaults:
      run:
        shell: bash
        working-directory: session-17-devsecops/demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Application build
        run: |
          mkdir -p reports
          python -m pip install -r requirements-dev.txt
          python -m compileall -q app
      - name: Unit tests
        run: python -m pytest -v --cov=app --cov-report=term-missing --junitxml=reports/tests.xml
      - name: SAST gate - Bandit
        run: bandit -r app -c security/bandit.yaml -ll -f json -o reports/bandit.json
      - name: SCA gate - pip-audit
        run: pip-audit -r requirements.txt -f json -o reports/pip-audit.json
      - name: Install Gitleaks and Trivy
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
      - name: Secret scanning gate - Gitleaks
        run: |
          mkdir -p /tmp/session17-secret-scope
          cp -R app tests security k8s Dockerfile requirements*.txt deploy.sh /tmp/session17-secret-scope/
          cp ../../.github/workflows/session17-devsecops.yml /tmp/session17-secret-scope/workflow.yml
          gitleaks dir /tmp/session17-secret-scope --config security/gitleaks.toml --redact --exit-code 1 --report-format json --report-path reports/gitleaks.json
      - name: Docker image build
        run: docker build --pull -t "$IMAGE" .
      - name: Container security gate - Trivy
        run: |
          trivy image --config security/trivy.yaml --format json --output reports/trivy.json "$IMAGE"
          trivy image --config security/trivy.yaml --format table "$IMAGE"
      - name: Publish gated image to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE" | tee reports/registry-push.txt
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' | tee reports/image-digests.json
      - name: Install Kind
        run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o /tmp/kind
          sudo install /tmp/kind /usr/local/bin/kind
      - name: Kubernetes deploy and verify
        run: bash deploy.sh | tee reports/deployment.txt
      - name: Upload test and security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session17-devsecops-reports
          path: session-17-devsecops/demo/reports/
          if-no-files-found: error
          retention-days: 7
