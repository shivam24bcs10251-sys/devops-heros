apiVersion: v1
kind: ConfigMap
metadata:
  name: session20-grafana
  namespace: session20
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n- access: proxy\n  isDefault: true\n\
    \  name: Session20 Prometheus\n  type: prometheus\n  uid: session20-prometheus\n\
    \  url: http://session20-prometheus:9090\n"
  dashboards.yaml: "apiVersion: 1\nproviders:\n- name: session20\n  options:\n   \
    \ path: /var/lib/grafana/dashboards\n  type: file\n"
  dashboard.json: '{"uid": "session20", "title": "Session 20 \u2014 Kubernetes observability",
    "schemaVersion": 40, "version": 1, "refresh": "5s", "time": {"from": "now-15m",
    "to": "now"}, "panels": [{"id": 1, "title": "Application CPU (% of one core)",
    "type": "stat", "datasource": {"type": "prometheus", "uid": "session20-prometheus"},
    "gridPos": {"x": 0, "y": 0, "w": 6, "h": 5}, "targets": [{"refId": "A", "expr":
    "100 * sum(rate(process_cpu_seconds_total{job=\"session20-app\"}[1m]))"}], "fieldConfig":
    {"defaults": {"unit": "percent"}, "overrides": []}, "options": {"reduceOptions":
    {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area", "textMode":
    "auto"}}, {"id": 2, "title": "Application resident memory", "type": "stat", "datasource":
    {"type": "prometheus", "uid": "session20-prometheus"}, "gridPos": {"x": 6, "y":
    0, "w": 6, "h": 5}, "targets": [{"refId": "A", "expr": "sum(process_resident_memory_bytes{job=\"session20-app\"})"}],
    "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}, "options": {"reduceOptions":
    {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area", "textMode":
    "auto"}}, {"id": 3, "title": "Healthy application pods", "type": "stat", "datasource":
    {"type": "prometheus", "uid": "session20-prometheus"}, "gridPos": {"x": 12, "y":
    0, "w": 6, "h": 5}, "targets": [{"refId": "A", "expr": "sum(demo_dependency_healthy{job=\"session20-app\"})"}],
    "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {"reduceOptions":
    {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area", "textMode":
    "auto"}}, {"id": 4, "title": "Requests / second", "type": "stat", "datasource":
    {"type": "prometheus", "uid": "session20-prometheus"}, "gridPos": {"x": 18, "y":
    0, "w": 6, "h": 5}, "targets": [{"refId": "A", "expr": "sum(rate(demo_requests_total{job=\"session20-app\"}[1m]))"}],
    "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}, "options": {"reduceOptions":
    {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area", "textMode":
    "auto"}}, {"id": 5, "title": "Application CPU history", "type": "timeseries",
    "datasource": {"type": "prometheus", "uid": "session20-prometheus"}, "gridPos":
    {"x": 0, "y": 5, "w": 12, "h": 10}, "targets": [{"refId": "A", "expr": "100 *
    sum(rate(process_cpu_seconds_total{job=\"session20-app\"}[1m]))"}], "fieldConfig":
    {"defaults": {"unit": "percent"}, "overrides": []}, "options": {"reduceOptions":
    {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area", "textMode":
    "auto"}}, {"id": 6, "title": "Application memory history", "type": "timeseries",
    "datasource": {"type": "prometheus", "uid": "session20-prometheus"}, "gridPos":
    {"x": 12, "y": 5, "w": 12, "h": 10}, "targets": [{"refId": "A", "expr": "sum(process_resident_memory_bytes{job=\"session20-app\"})"}],
    "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}, "options": {"reduceOptions":
    {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area", "textMode":
    "auto"}}], "tags": ["session20", "assignment"]}'
