apiVersion: v1
kind: ServiceAccount
metadata:
  name: session20-prometheus
  namespace: session20
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session20-discovery
  namespace: session20
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session20-discovery
  namespace: session20
subjects:
- kind: ServiceAccount
  name: session20-prometheus
  namespace: session20
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session20-discovery
