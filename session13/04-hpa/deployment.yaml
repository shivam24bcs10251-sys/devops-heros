apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: [python3, -u, -c]
          args:
            - |
              import math
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      sum(math.sqrt(i) for i in range(200000))
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"HPA CPU workload\n")
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", 80), Handler).serve_forever()
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
