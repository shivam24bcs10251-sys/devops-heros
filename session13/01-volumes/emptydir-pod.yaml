apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
spec:
  containers:
    - name: writer
      image: busybox:1.37
      command: [sh, -c, "sleep 86400"]
      volumeMounts:
        - name: shared
          mountPath: /data
    - name: reader
      image: busybox:1.37
      command: [sh, -c, "sleep 86400"]
      volumeMounts:
        - name: shared
          mountPath: /data
  volumes:
    - name: shared
      emptyDir: {}
