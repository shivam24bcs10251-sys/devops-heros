# Apply only after Terraform has installed the EBS CSI driver on EKS.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: labledger-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
