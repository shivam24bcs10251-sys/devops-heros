apiVersion: v1
kind: Service
metadata:
  name: postgres
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  selector: {app: labledger-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: labledger-postgres
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: labledger-postgres}}
  template:
    metadata: {labels: {app: labledger-postgres}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 70}
      containers:
      - name: postgres
        image: {{ .Values.postgres.image | quote }}
        envFrom: [{secretRef: {name: {{ .Values.postgres.secretName }}}}]
        env:
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports: [{containerPort: 5432}]
        readinessProbe:
          exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      {{- if .Values.postgres.storageClass }}
      storageClassName: {{ .Values.postgres.storageClass | quote }}
      {{- end }}
      resources: {requests: {storage: {{ .Values.postgres.storage }}}}
