apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {app: labledger-backend}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  selector: {app: labledger-backend}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labledger-backend
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector: {matchLabels: {app: labledger-backend}}
  template:
    metadata:
      labels: {app: labledger-backend}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: schema-ready
        image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: [python, -m, app.wait_schema]
        env:
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: {{ .Values.postgres.secretName }}, key: DATABASE_URL}}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      containers:
      - name: backend
        image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports: [{containerPort: 8000}]
        envFrom: [{configMapRef: {name: labledger-settings}}]
        env:
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: {{ .Values.postgres.secretName }}, key: DATABASE_URL}}
        startupProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 3, failureThreshold: 40}
        readinessProbe: {httpGet: {path: /ready, port: 8000}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 10}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        resources:
{{ toYaml .Values.backendResources | indent 10 }}
